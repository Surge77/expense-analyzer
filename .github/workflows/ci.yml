name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Cancel an in-flight run when the same branch is pushed again — no point
# burning minutes on a commit that has already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Lint only, deliberately not `ruff format`. The formatter de-indents
      # the command samples inside module docstrings, which removes the visual
      # cue that they are code. Readability wins over formatter uniformity in
      # a repo whose point is being read. See docs/decisions/.
      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      # Non-blocking for now: pandas and matplotlib ship loose type stubs, so
      # `ExtensionArray` vs `ArrayLike` produces ~27 false positives that say
      # nothing about correctness. Phase 1 resolves them, then `continue-on-
      # error` comes off and this becomes a real gate.
      - name: Types (informational)
        run: pyright
        continue-on-error: true

  smoke:
    name: end-to-end run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # Proves the committed sample and the CLI still work together — the
      # thing a new contributor does first, and the thing most likely to rot.
      - name: Regenerate sample and run the pipeline
        run: |
          python scripts/make_sample.py
          python -m expense_analyzer

      - name: Confirm charts were written
        run: |
          test -f reports/01_spend_by_category.png
          test -f reports/02_monthly_total.png
          test -f reports/03_category_by_month.png
          test -f reports/04_transaction_sizes.png
          echo "all four charts present"
