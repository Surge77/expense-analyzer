name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Cancel an in-flight run when the same branch is pushed again — no point
# burning minutes on a commit that has already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Lint only, deliberately not `ruff format`. The formatter de-indents
      # the command samples inside module docstrings, which removes the visual
      # cue that they are code. Readability wins over formatter uniformity in
      # a repo whose point is being read. See docs/decisions/.
      - name: Lint
        run: ruff check .

      - name: Tests
        # Gate at 90, currently sitting at 100. The headroom is deliberate:
        # a gate pinned to the exact current number turns every later commit
        # into a coverage-chasing exercise and invites tests written to move
        # the number rather than to catch anything.
        run: pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Types
        run: pyright

  smoke:
    name: end-to-end run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # Proves the committed sample and the CLI still work together — the
      # thing a new contributor does first, and the thing most likely to rot.
      - name: Regenerate sample and run the pipeline
        run: |
          python scripts/make_sample.py
          python -m expense_analyzer

      - name: Confirm charts were written
        run: |
          test -f reports/01_spend_by_category.png
          test -f reports/02_monthly_total.png
          test -f reports/03_category_by_month.png
          test -f reports/04_transaction_sizes.png
          echo "all four charts present"
