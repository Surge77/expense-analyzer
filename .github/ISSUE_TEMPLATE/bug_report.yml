name: Bug report
description: Something behaves differently from what the docs say
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste a real bank statement.** It contains your account
        number and full transaction history. A redacted two-row CSV that
        reproduces the problem is ideal.
  - type: textarea
    id: command
    attributes:
      label: What did you run?
      render: shell
      placeholder: python -m expense_analyzer --source household
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Paste the full output or traceback.
      render: shell
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.11.9 — from python --version"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 / Ubuntu 24.04 / macOS 15"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have removed all real account numbers, UPI handles and narrations
          required: true
        - label: I ran `pytest` and included the result if it failed
