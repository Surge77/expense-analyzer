name: Feature request
description: Suggest a capability or a new data source
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part does this touch?
      options:
        - Categorisation rules
        - A new bank or export format
        - The classifier or evaluation
        - Charts and reporting
        - Documentation
        - Something else
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What else did you consider?
      description: |
        Including "nothing" is a fine answer. This project prefers three
        similar lines over a premature abstraction, so a narrow fix is often
        the right call.
